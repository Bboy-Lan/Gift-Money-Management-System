name: Validate isolated variant (no automatic publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare development dependencies (networked CI setup)
        run: npm ci
      - name: Prepare locked Rust cache (networked CI setup)
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Offline quality gate
        run: npm.cmd run verify
      # No upload or GitHub Release step. Offline user installers require an
      # explicitly pre-provisioned fixed WebView2 runtime and release:local.
      # Standard uses the configured online bootstrapper; offline uses the overlay.
      # Both retain this product's own asset names. No automatic upload.
