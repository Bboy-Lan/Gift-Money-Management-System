name: Validate isolated variant (no automatic publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare development dependencies (networked CI setup)
        run: npm ci
      - name: Prepare locked Rust cache (networked CI setup)
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Offline quality gate
        run: npm.cmd run verify
      # No upload or GitHub Release step. Local releases use the standard
      # installer with the configured online WebView2 bootstrapper only.
